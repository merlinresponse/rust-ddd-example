[package]
name = "task_manager"
version = "0.1.0"
edition = "2021"
publish = false
description = "A small, heavily commented layered DDD example in Rust (Task Manager)"

[dependencies]
axum = "0.8"                                                    # HTTP framework (presentation edge)
serde = { version = "1", features = ["derive"] }                # JSON (de)serialisation of DTOs
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }                     # task identities

[dev-dependencies]
http-body-util = "0.1"                                          # read response bodies in E2E tests
tower = { version = "0.5", features = ["util"] }                # `oneshot` a request through the router

# Smaller dev builds: keep only line tables (file:line in panics and backtraces) instead of
# full debug info. Roughly halves target/ size and speeds up linking.
# Switch back to `debug = true` temporarily if you need a step-through debugger.
[profile.dev]
debug = "line-tables-only"
